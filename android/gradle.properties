# 中文注释与中文字符串字面量要求编译器/资源流程按 UTF-8 读写，否则 Windows 默认 GBK 会乱码
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 内网 HTTP 明文是显式设计选择（见 res/xml/network_security_config.xml），关闭该检查避免构建期误报
android.suppressUnsupportedCompileSdk=34
